<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GreenArt Netlify Forms</title>
  </head>
  <body>
    <!-- Static blueprint required for Netlify form detection in a JS/Next.js app. -->
    <form name="greenart-b2b-request" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="greenart-b2b-request" />
      <input name="bot-field" />
      <input name="company" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="country" />
      <input name="business" />
      <input name="volume" />
      <textarea name="message"></textarea>
      <input name="privacy_acknowledged" />
      <input name="privacy_version" />
      <input name="privacy_acknowledged_at" />
      <input name="privacy_language" />
      <input name="privacy_choice" />
      <input name="privacy_choice_version" />
    </form>
  </body>
</html>
