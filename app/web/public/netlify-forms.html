<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GreenArt Netlify Forms</title>
  </head>
  <body>
    <!--
      Static form blueprint for Netlify form detection.
      The visible Next.js form submits these same fields via AJAX.
    -->
    <form
      name="greenart-b2b-request"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="greenart-b2b-request" />
      <input name="bot-field" />
      <input name="company" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="country" />
      <input name="business" />
      <input name="volume" />
      <textarea name="message"></textarea>
      <input name="privacy_acknowledged" />
      <input name="privacy_version" />
      <input name="privacy_acknowledged_at" />
      <input name="privacy_language" />
    </form>
  </body>
</html>
